name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm needs the tags for the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and doc dependencies
        run: pip install .[docs]

      # lstchain still pins gammapy~=1.3, but the bkg code needs FoVICRSFrame
      # (gammapy >= 2.0). Override the pin the same way the dev env does.
      - name: Upgrade gammapy to 2.x
        run: pip install --no-deps "gammapy>=2"

      - name: Build the documentation
        run: sphinx-build -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
