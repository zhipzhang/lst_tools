[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lst_tools"
dynamic = ["version"]
description = "Utilities built on top of lstchain and ctapipe for LST data analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["lst", "cta", "gamma-ray", "astronomy"]
dependencies = [
    "lstchain",
    "ctapipe",
    "packaging",
    "tables",
    "tomli; python_version < '3.11'",
    "gammapy",
    "hist",
    "h5py",
    "uhi",
]

[project.scripts]
build-dl2-background = "lst_tools.scripts.build_dl2_background:main"
build-workrun = "lst_tools.scripts.build_workrun:main"
init-lstana = "lst_tools.scripts.init_lstana:main"
prepare-offruns = "lst_tools.scripts.prepare_offruns:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"


[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportUnannotatedClassAttribute = "none"
