[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lst_ulities"
dynamic = ["version"]
description = "Utilities built on top of lstchain and ctapipe for LST data analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["lst", "cta", "gamma-ray", "astronomy"]
dependencies = [
    "lstchain",
    "ctapipe",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
